<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold tracking-tight">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-500 text-white">T</span>
     
      </a>

      <nav class="hidden gap-7 text-sm text-slate-300 md:flex">
        <a href="index.html" class="transition hover:text-white">Главная</a>
        <a href="about.html" class="transition hover:text-white">О продукте</a>
        <a href="pricing.html" class="transition hover:text-white">Тарифы</a>
        <a href="contact.html" class="text-white">Контакты</a>
      </nav>

      <a href="pricing.html" class="rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 px-4 py-2 text-sm font-semibold text-white transition hover:brightness-110">
        Тарифы
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-20">
    <h1 class="text-4xl font-black sm:text-5xl">Свяжитесь с нами</h1>

    <p class="mt-4 text-lg text-slate-300">
      Расскажите, что нужно вашей команде, и мы поможем разобраться.
    </p>

    <form class="mt-10 grid gap-4 rounded-3xl border border-white/10 bg-white/5 p-7 sm:grid-cols-2">
      <input
        class="rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-violet-400"
        placeholder="Имя"
        required
      />

      <input
        class="rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-violet-400"
        type="email"
        placeholder="Email"
        required
      />

      <input
        class="rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-violet-400 sm:col-span-2"
        placeholder="Название компании или команды"
      />

      <textarea
        class="min-h-32 rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-violet-400 sm:col-span-2"
        placeholder="Чем можем помочь?"
      ></textarea>

      <button class="rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 px-6 py-3 font-semibold text-white transition hover:brightness-110 sm:col-span-2">
        Отправить заявку
      </button>
    </form>

    <div class="mt-12 flex items-center justify-center rounded-2xl border-2 border-dashed border-pink-400/40 bg-pink-500/10 p-10">
      <span class="text-sm font-medium text-pink-200">
        Рекламное место · Advertisement
      </span>
    </div>
  </main>

  <footer class="border-t border-white/10 py-10">
    <div class="mx-auto max-w-6xl px-4 text-sm text-slate-400">
      © 2026 TaskFlow
    </div>
  </footer>

</body>
</html>
